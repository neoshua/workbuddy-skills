# 参考：本项目（Android APK）已验证通过的 GitHub Actions 工作流
# 位置：仓库根 .github/workflows/build.yml
# 要点：
#   1) 不用 android-actions/setup-android@v3（被强迁 Node24 易挂），改用 runner 预装 SDK
#   2) build_apk.sh 用 aapt2+javac+d8+zipalign+apksigner 手工构建（无需 Gradle）
#   3) 构建后由 gh CLI 发布到滚动 latest Release（GitHub 服务器端，绕开沙箱 uploads.github.com 劫持）
#   4) 发布前 cp 成 ASCII 文件名，避免中文被截断
#   5) 版本号 1.x：主版本固定 1，次版本 = run_number - MINOR_BASE
#
# 注意：本文件仅作参考模板；实际使用时需与仓库内的 tools/build_apk.sh 配合。

name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 刻意不用 android-actions/setup-android@v3：该 action 近期被强制运行在 Node.js 24 上，
      # 常在 setup 阶段直接失败，导致后续 sdkmanager/编译/上传全部 skipped。
      # 改为直接使用 GitHub runner 预装的 Android SDK，仅当缺包时才用 sdkmanager 安装。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$SDK/tools/bin:$SDK/platform-tools:$PATH"

          # 兜底：runner 上完全没有 command-line tools 时自行下载
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "未找到 sdkmanager，下载 Android command-line tools…"
            curl -fsSL -o /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p /tmp/cmdtools
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          fi
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          pick_bt() {
            for v in 34.0.0 35.0.0 36.0.0; do
              if [ -x "$SDK/build-tools/$v/aapt2" ]; then echo "$SDK/build-tools/$v"; return 0; fi
            done
            for d in "$SDK"/build-tools/*; do
              if [ -x "$d/aapt2" ]; then echo "$d"; return 0; fi
            done
            return 1
          }
          pick_jar() {
            for v in 34 35 36 33; do
              if [ -f "$SDK/platforms/android-$v/android.jar" ]; then echo "$SDK/platforms/android-$v/android.jar"; return 0; fi
            done
            for f in "$SDK"/platforms/android-*/android.jar; do
              if [ -f "$f" ]; then echo "$f"; return 0; fi
            done
            return 1
          }

          BT="$(pick_bt || true)"
          JAR="$(pick_jar || true)"

          if [ -z "$BT" ] || [ -z "$JAR" ]; then
            echo "预装 SDK 缺少 build-tools / platform，使用 sdkmanager 安装…"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0"
            BT="$(pick_bt || true)"
            JAR="$(pick_jar || true)"
          fi

          if [ -z "$BT" ] || [ -z "$JAR" ]; then
            echo "::error::Android SDK 准备失败：找不到 build-tools 或 android.jar"
            exit 1
          fi
          echo "build-tools = $BT"
          echo "android.jar  = $JAR"
          echo "BT=$BT"   >> "$GITHUB_ENV"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: 编译并签名 APK
        run: bash tools/build_apk.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: family-call-helper-apk
          path: dist/*.apk
          if-no-files-found: error

      # 发布到固定的 latest Release：直接挂 .apk（非 ZIP），永久可下载。
      # 该步骤在 GitHub 自己的 runner 上运行，能正常访问 releases 上传端点，
      # 不受本机/沙箱网络 DNS 限制影响。
      - name: 发布到 Release (latest, 版本号 1.x)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC="$(ls dist/*.apk | head -n1)"
          # 主版本号 MAJOR：升到 2 时由人工把下面 MAJOR 改为 2，
          # 并同步把 MINOR_BASE 设为当时构建号，使次版本从 1 重新开始（如 2.1）。
          MAJOR=1
          MINOR_BASE=8
          RUN="${{ github.run_number }}"
          VER="${MAJOR}.$(( RUN - MINOR_BASE ))"
          # 复制为带版本号的 ASCII 文件名，避免中文名被截断
          APK="dist/family-call-helper-v${VER}.apk"
          cp "$SRC" "$APK"
          echo "准备发布 APK: $APK (版本 v${VER})"
          # 删除旧的 latest 发布与标签，重建为滚动最新版（固定链接下载）
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest "$APK" \
            --title "最新构建 v${VER}" \
            --notes "版本 v${VER}（构建 #${RUN}），基于提交 ${{ github.sha }} 自动构建。" \
            --prerelease
